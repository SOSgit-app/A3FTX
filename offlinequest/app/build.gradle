plugins {
    id "com.android.application"
}

def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("../quest/keystore.properties")
if (!keystorePropsFile.exists()) {
    throw new GradleException("Missing quest/keystore.properties. The offline APK has to use the store signing key.")
}
keystorePropsFile.withInputStream { keystoreProps.load(it) }

android {
    namespace "com.sosgitapp.a3ftx"
    compileSdk 34

    defaultConfig {
        applicationId "com.sosgitapp.a3ftx"
        minSdk 34
        targetSdk 34
        versionCode 6
        versionName "6"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    signingConfigs {
        release {
            storeFile rootProject.file("../quest/android.keystore")
            storePassword keystoreProps.getProperty("storePassword")
            keyAlias "android"
            keyPassword keystoreProps.getProperty("keyPassword")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.meta.metavr:metavr-os-jsdk:207"
    implementation "org.khronos.openxr:openxr_loader_for_android:1.0.34"
}
